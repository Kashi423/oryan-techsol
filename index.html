<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Site-wide defaults for crawlers and link scrapers that do not run JS.
         Tags marked data-seo-default are replaced at runtime by <Seo />
         (src/components/seo/Seo.jsx), which supplies the per-page values. -->
    <title data-seo-default>Oryan Techsol | App, Software, Web &amp; AI Development</title>
    <meta
      data-seo-default
      name="description"
      content="Oryan Techsol builds custom mobile apps, software, websites, AI business bots and automation systems for growing companies — technology built around how your business actually works."
    />
    <meta data-seo-default property="og:site_name" content="Oryan Techsol" />
    <meta data-seo-default property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta
      data-seo-default
      property="og:title"
      content="Oryan Techsol | App, Software, Web &amp; AI Development"
    />
    <meta
      data-seo-default
      property="og:description"
      content="Oryan Techsol builds custom mobile apps, software, websites, AI business bots and automation systems for growing companies — technology built around how your business actually works."
    />
    <meta data-seo-default name="twitter:card" content="summary" />
    <meta
      data-seo-default
      name="twitter:title"
      content="Oryan Techsol | App, Software, Web &amp; AI Development"
    />
    <meta
      data-seo-default
      name="twitter:description"
      content="Oryan Techsol builds custom mobile apps, software, websites, AI business bots and automation systems for growing companies — technology built around how your business actually works."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Oryan Techsol",
            "url": "%VITE_SITE_URL%/",
            "description": "Custom mobile apps, software, web development, AI bots and business automation."
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Oryan Techsol",
            "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Oryan Techsol builds custom apps, software, websites, AI bots and business automation.
      Please enable JavaScript to view this site.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
