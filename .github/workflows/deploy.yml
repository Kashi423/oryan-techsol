name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The FTP_* secrets are stored as environment secrets in the "FTP Server" environment.
    environment: FTP Server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      # Bake whatever is published in the admin (blog, team, portfolio, text edits, menu) into the
      # build so the prerendered HTML — what Google and social bots read — is up to date. Fails
      # soft: if the backend isn't installed or is unreachable, the committed content is used.
      - name: Fetch published content from the admin
        run: node scripts/fetch-cms.mjs
        env:
          CMS_API_URL: https://oryantechsol.com/api

      # Social-share images for every article (including ones created in the admin).
      - name: Generate social images
        run: node scripts/og-images.mjs

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://oryantechsol.com

      - name: Stamp build version
        run: echo "$GITHUB_SHA" > dist/deploy-version.txt

      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**

      # Fails the run if the upload went to the wrong folder (green FTP step, unchanged site).
      - name: Verify live site serves this build
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://oryantechsol.com/deploy-version.txt?cb=$i" | grep -q "$GITHUB_SHA"; then
              echo "Live site is serving $GITHUB_SHA"; exit 0
            fi
            sleep 10
          done
          echo "Live site does not have this build — check FTP server-dir / account folder"; exit 1
